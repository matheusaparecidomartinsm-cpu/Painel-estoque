<title>Painel Estoque &amp; OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05130e; --surface:#0a1c15; --surface-2:#0f271e; --surface-3:#143226;
  --line:#1b3a2e; --line-strong:#25493b;
  --text:#e5f3ec; --text-2:#9cbdae; --muted:#688c7c;
  --accent:#34d9a0; --accent-hi:#6fe8bf; --accent-ink:#03261a; --accent-soft:rgba(52,217,160,.13);
  --ok:#34d9a0; --warn:#e8c36a; --risk:#f39a5b; --crit:#f27a7a; --info:#6aa8f0; --none:#5d7a6e;
  --f-disp:'Outfit','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:radial-gradient(1100px 560px at 0% -10%,rgba(52,217,160,.10),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
a{color:var(--accent-hi)}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(6,21,15,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand h1{margin:0;font:600 16px/1.15 var(--f-disp)}
.mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 24px rgba(52,217,160,.4);flex:none}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.upd{font-size:12px;color:var(--text-2);display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.upd b{font-weight:600;color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:500 13px var(--f-body);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 0 22px rgba(52,217,160,.25)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:rgba(242,122,122,.4)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn.icon{width:36px;padding:0}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bell{position:relative}
.bell .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font:700 11px/18px var(--f-body);text-align:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:6px;z-index:40;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.menu .mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px}
.menu .mrow:hover{background:var(--surface-2)}
.menu .mrow span{font-size:13px}
.menu .fmts{display:flex;gap:4px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .mh{padding:6px 10px 2px;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- layout ---------- */
.wrap{max-width:1480px;margin:0 auto;padding:20px 20px 64px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.card-h h2{margin:0;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.card-h .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.chart-box{position:relative;height:280px}
.chart-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:13px}
.sec-title{margin:6px 0 -4px;font:650 12px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- banners ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:13px}
.banner p{margin:0;flex:1 1 320px}
.banner.sample{border-color:rgba(59,130,246,.45);background:rgba(59,130,246,.08)}
.banner.danger{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.09)}
.banner.danger strong{color:#f7a8a8}
.banner .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.banner.danger .ico{background:rgba(239,68,68,.2);color:#f7a8a8}
.banner.sample .ico{background:rgba(59,130,246,.2);color:#93C5FD}
.notices{font-size:13px}
.notices summary{cursor:pointer;color:var(--text-2);list-style:none;display:flex;align-items:center;gap:8px}
.notices summary::-webkit-details-marker{display:none}
.notices ul{margin:10px 0 0;padding-left:18px;color:var(--text-2);display:grid;gap:4px}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.role{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--text-2)}
.role.on{border-color:rgba(16,185,129,.5);color:var(--accent-hi);background:rgba(16,185,129,.08)}

/* ---------- filters ---------- */
.filters .f-grid{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
.f-more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.filters{padding-block:14px}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inp,select.inp{height:38px;width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:0 10px;font:13px var(--f-body)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(52,217,160,.18)}
.f-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.f-foot:has(.chips:empty){display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;border-radius:13px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:var(--accent-hi);font-size:12px}
.chip button{width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1}
.chip button:hover{background:rgba(16,185,129,.25)}
.f-toggle{height:36px}

/* ---------- perigo (hero) ---------- */
.perigo-card{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px 36px;padding:26px clamp(18px,3vw,32px);border-color:rgba(242,122,122,.38);
  background:radial-gradient(700px 380px at 0% 0%,rgba(242,122,122,.14),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(52,217,160,.06),transparent 60%),#081a13}
.perigo-card::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(52,217,160,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(52,217,160,.05) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse at 20% 30%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 20% 30%,#000 15%,transparent 70%);pointer-events:none}
.perigo-card>*{position:relative}
.perigo-card.calm{border-color:var(--line);background:radial-gradient(700px 380px at 0% 0%,rgba(52,217,160,.12),transparent 60%),#081a13;grid-template-columns:minmax(0,1fr)}
.pg-left{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--crit)}
.perigo-card.calm .eyebrow{color:var(--accent)}
.pg-big{margin:0;font:600 clamp(28px,3.4vw,42px)/1.06 var(--f-disp);letter-spacing:-.02em;text-wrap:balance}
.pg-big em{font-style:normal;color:var(--crit)}
.perigo-card.calm .pg-big em{color:var(--accent)}
.pg-left p{margin:0;color:var(--text-2);font-size:14px;max-width:46ch}
.pg-acts{display:flex;flex-wrap:wrap;gap:8px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:auto;max-width:420px}
.vbars span{flex:1;min-width:6px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--accent),rgba(52,217,160,.12))}
.vbars span.r{background:linear-gradient(180deg,var(--crit),rgba(242,122,122,.12))}
.vnote{font-size:11.5px;color:var(--muted)}
.pl{display:grid;gap:4px;align-content:start}
.pr{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(70px,.8fr) 92px;gap:16px;align-items:center;padding:10px 12px;border:1px solid transparent;border-radius:12px;background:rgba(5,19,14,.55);text-align:left;cursor:pointer;width:100%}
.pr:hover{border-color:rgba(242,122,122,.35)}
.pr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .cd{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--crit),#f7a8a8);border-radius:3px}
.pr .dd{text-align:right;font:600 19px/1 var(--f-disp);color:#f7a8a8;font-variant-numeric:tabular-nums}
.pr .dd small{display:block;font:500 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pl-more{font-size:12.5px;color:var(--text-2);padding:6px 12px}
@media (max-width:900px){ .perigo-card{grid-template-columns:minmax(0,1fr)} .vbars{display:none} }
.pend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pchip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:12.5px;color:var(--text-2);cursor:pointer}
.pchip b{color:var(--text);font-variant-numeric:tabular-nums}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pchip:hover,.pchip.on{border-color:var(--c)}
.pchip.zero{opacity:.5}
.cobc{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.cobc i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.foot-note{margin:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-hi);font:500 12.5px var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:4px;cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--line-strong)}
.kpi.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi .lbl{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .lbl i{width:8px;height:8px;border-radius:2px;background:var(--dot,var(--accent));flex:none}
.kpi .val{font:600 32px/1.1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12px;color:var(--text-2)}
.kpi.alarm .val{color:#f7a8a8}

/* ---------- production flow ---------- */
.flow-track{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.stage{flex:1 0 124px;min-width:124px;border:0;cursor:pointer;text-align:left;padding:12px 20px 12px 24px;background:var(--surface-2);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);display:grid;gap:2px}
.stage:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:14px;border-radius:8px 0 0 8px}
.stage .n{font:700 24px/1 var(--f-disp);font-stretch:90%;font-variant-numeric:tabular-nums}
.stage .l{font:600 11.5px/1.25 var(--f-disp);font-stretch:90%;letter-spacing:.02em;color:var(--text-2)}
.stage .o{font-size:11px;color:var(--muted)}
.stage.on{outline:none;background:var(--accent)!important}
.stage.on .n,.stage.on .l,.stage.on .o{color:var(--accent-ink)}
.stage:hover .l{color:var(--text)}
.flow-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}

/* ---------- alerts ---------- */
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;text-align:left;cursor:pointer}
.alert:hover{border-color:var(--c)}
.alert.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.alert .sev{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.04)}
.alert .t{font-weight:600;font-size:13.5px}
.alert .d{grid-column:2;font-size:12px;color:var(--muted)}
.alert .n{grid-row:1/span 2;grid-column:3;font:700 24px var(--f-disp);font-stretch:90%;font-variant-numeric:tabular-nums}
.alert.zero{opacity:.5}
.alert.big{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:999px;font:600 11.5px/1.5 var(--f-body);white-space:nowrap;border:1px solid transparent}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b.perigo,.b.insuf,.b.crit{color:#f7a8a8;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.38)}
.b.risk{color:#FDBA74;background:rgba(249,115,22,.14);border-color:rgba(249,115,22,.38)}
.b.warn{color:#FDE047;background:rgba(234,179,8,.13);border-color:rgba(234,179,8,.36)}
.b.normal,.b.ok{color:#86EFAC;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.34)}
.b.info,.b.empenhado{color:#93C5FD;background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.38)}
.b.zero{color:#CBD5E1;background:#000;border-color:#334155}
.b.semdados,.b.nd,.b.none{color:#B6C3BD;background:rgba(100,116,139,.14);border-color:rgba(100,116,139,.35)}
.stg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.stg i{width:8px;height:8px;border-radius:2px;background:var(--sc,var(--none));flex:none}
.oslink{background:none;border:0;padding:0;color:var(--accent-hi);font:500 12.5px var(--f-mono);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(52,211,153,.35);text-underline-offset:3px}
.oslink:hover{text-decoration-color:var(--accent-hi)}
.ins{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#f7a8a8}

/* ---------- tables ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:-4px 0 12px}
.tab{padding:10px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--text-2);font:500 14px var(--f-disp);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab .c{font-weight:500;color:var(--muted);margin-left:4px}
.t-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.t-tools .sp{flex:1}
.t-tools .note{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.grid th{position:sticky;top:0;z-index:1;background:var(--surface-3);text-align:left;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);padding:10px 12px;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line-strong)}
table.grid th.num{text-align:right}
table.grid th .ar{color:var(--accent-hi);margin-left:4px}
table.grid td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.grid tbody tr:first-child td{border-top:0}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--surface-2)}
table.grid td.tw{white-space:normal;min-width:220px;max-width:320px}
table.grid td.small{font-size:12px;color:var(--text-2)}
table.grid tr.row-perigo td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--text-2)}
.pager .pg{display:flex;gap:4px;align-items:center}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,10,7,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.mdl{width:min(1000px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.mdl-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.mdl-h h3{margin:0;font:600 21px/1.2 var(--f-disp);text-wrap:balance}
.mdl-h .sub{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--text-2)}
.mdl-b{padding:18px 20px 22px;display:grid;gap:20px}
.mdl-b h4{margin:0 0 10px;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface-2);padding:10px 12px;min-width:0}
.stat .k{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:650 17px/1.35 var(--f-disp);font-stretch:94%;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v small{font:400 12px var(--f-body);color:var(--text-2)}
.formula{font:12.5px/1.75 var(--f-mono);background:var(--bg);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;color:var(--text-2);overflow-x:auto}
.formula b{color:var(--text);font-weight:500}
.tl{list-style:none;margin:0;padding:2px 0 0 20px;border-left:2px solid var(--line-strong);display:grid;gap:14px}
.tl li{position:relative;display:grid;gap:2px}
.tl li::before{content:"";position:absolute;left:-28px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--accent))}
.tl .t1{font-weight:600}

/* number parsing: handles 1.234,56 / 1,234.56 / 1234,5 / R$ / units */
function parseNum(v){
  if(v==null) return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  if(typeof v==='boolean') return null;
  let s=String(v).trim(); if(!s) return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  s=s.replace(/[^\d.,\-]/g,'');
  if(s.startsWith('-')){ neg=!neg; s=s.slice(1); }
  s=s.replace(/-/g,'');
  if(!s||!/\d/.test(s)) return null;
  const hc=s.includes(','), hd=s.includes('.');
  if(hc&&hd){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(hc){ if((s.match(/,/g)||[]).length>1) s=s.replace(/,/g,''); else s=s.replace(',','.'); }
  else if(hd){ const n=(s.match(/\./g)||[]).length; if(n>1) s=s.replace(/\./g,''); else if(/^\d{1,3}\.\d{3}$/.test(s)) s=s.replace('.',''); }
  const n=parseFloat(s); if(!isFinite(n)) return null; return neg?-n:n;
}
const MONTHS={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12,feb:2,apr:4,may:5,aug:8,sep:9,oct:10,dec:12};
function mkDate(y,m,d,h,mi){ if(y<100) y+=2000; if(m<1||m>12||d<1||d>31) return null; const dt=new Date(y,m-1,d,h||0,mi||0); if(dt.getMonth()!==m-1) return null; return dt; }
function serialToDate(v){ const ms=Math.round((v-25569)*86400000); const u=new Date(ms); return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),u.getUTCHours(),u.getUTCMinutes()); }
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return isNaN(v)?null:{date:v,hasTime:!!(v.getHours()||v.getMinutes())};
  if(typeof v==='number'){
    if(v>19000000&&v<21000000){ const d=mkDate(Math.floor(v/10000),Math.floor(v/100)%100,v%100); return d?{date:d,hasTime:false}:null; }
    if(v>20000&&v<80000){ return {date:serialToDate(v),hasTime:(v%1)>0.0001}; }
    return null;
  }
  const s=String(v).trim(); if(!s) return null;
  if(/^\d+(\.\d+)?$/.test(s)) return parseDate(parseFloat(s));
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s](\d{1,2}):(\d{2}))?/);
  if(m){ const d=mkDate(+m[1],+m[2],+m[3],m[4]?+m[4]:0,m[5]?+m[5]:0); return d?{date:d,hasTime:!!m[4]}:null; }
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[\sT,]+(?:às\s*)?(\d{1,2})[:h](\d{2}))?/i);
  if(m){ let d1=+m[1],m1=+m[2]; if(m1>12&&d1<=12){ const x=d1; d1=m1; m1=x; } const d=mkDate(+m[3],m1,d1,m[4]?+m[4]:0,m[5]?+m[5]:0); return d?{date:d,hasTime:!!m[4]}:null; }
  m=norm(s).match(/^(\d{1,2}) (?:de )?([a-z]{3})[a-z]* (?:de )?(\d{2,4})(?: (\d{1,2}) (\d{2}))?/);
  if(m&&MONTHS[m[2]]){ const d=mkDate(+m[3],MONTHS[m[2]],+m[1],m[4]?+m[4]:0,m[5]?+m[5]:0); return d?{date:d,hasTime:!!m[4]}:null; }
  return null;
}
function parseTime(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return {h:v.getHours(),m:v.getMinutes()};
  if(typeof v==='number'){ if(v>=0&&v<1){ const t=Math.round(v*1440); return {h:Math.floor(t/60)%24,m:t%60}; } if(v>=1){ const f=v%1; const t=Math.round(f*1440); return {h:Math.floor(t/60)%24,m:t%60}; } return null; }
  const m=String(v).trim().match(/(\d{1,2})\s*[:h]\s*(\d{2})/i); if(!m) return null;
  const h=+m[1], mi=+m[2]; if(h>23||mi>59) return null; return {h,m:mi};
}

const FIELD_KEYS=Object.keys(FIELDS);
function scoreHeader(h){
  const n=norm(h); if(!n) return {f:null,s:0};
  let best=null,bs=0; const pn=' '+n+' ';
  for(const f of FIELD_KEYS){ for(const syn of FIELDS[f].syn){
    let s=0; if(n===syn) s=1000+syn.length; else if(syn.length>=4&&pn.includes(' '+syn+' ')) s=syn.length;
    if(s>bs){ bs=s; best=f; }
  }}
  return {f:best,s:bs};
}
function autoMap(headers){
  const sc=headers.map(scoreHeader), map=headers.map(()=>null), used={};
  sc.map((x,i)=>({i,f:x.f,s:x.s})).filter(x=>x.f).sort((a,b)=>b.s-a.s||a.i-b.i).forEach(x=>{ if(!used[x.f]){ used[x.f]=1; map[x.i]=x.f; } });
  return map;
}
function detectHeaderRow(aoa){
  let best=0,bs=-1;
  for(let i=0;i<Math.min(aoa.length,15);i++){
    const r=aoa[i]||[]; const cells=r.filter(c=>c!=null&&String(c).trim()!=='');
    if(cells.length<2) continue;
    const s=autoMap(r.map(c=>c==null?'':String(c))).filter(Boolean).length*10+cells.filter(c=>typeof c==='string').length;
    if(s>bs){ bs=s; best=i; }
  }
  return best;
}
function makeTable(aoa,file,sheet){
  if(!aoa||!aoa.length) return null;
  const hr=detectHeaderRow(aoa);
  const width=Math.max(...aoa.slice(hr,hr+50).map(r=>(r||[]).length),0);
  const headers=[]; for(let i=0;i<width;i++){ const h=(aoa[hr]||[])[i]; headers.push(h==null||String(h).trim()===''?'Coluna '+(i+1):String(h).trim()); }
  const rows=aoa.slice(hr+1).filter(r=>r&&r.some(c=>c!=null&&String(c).trim()!=='')).map(r=>{ const o=new Array(width); for(let i=0;i<width;i++){ const c=r[i]; o[i]=c===undefined?null:c; } return o; });

}

}

/* CSV */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=(text.split(/\r?\n/).find(l=>l.trim())||'');
  let delim=';',best=-1; for(const d of [';',',','\t','|']){ let c=0,q=false; for(const ch of first){ if(ch==='"') q=!q; else if(ch===d&&!q) c++; } if(c>best){ best=c; delim=d; } }
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(c=>{ const t=c.trim(); return t===''?null:t; }));
}
async function readFile(file){
  const name=file.name, ext=(name.split('.').pop()||'').toLowerCase();
  const buf=await file.arrayBuffer();
  if(ext==='csv'||ext==='txt'){
    let text=new TextDecoder('utf-8').decode(buf);
    if(text.includes('\uFFFD')) text=new TextDecoder('windows-1252').decode(buf);
    const t=makeTable(parseCSV(text),name,''); return t?[t]:[];
  }
  if(!window.XLSX) throw new Error('A biblioteca de leitura de Excel não carregou. Verifique a conexão ou salve a planilha como CSV.');
  const wb=XLSX.read(buf,{type:'array',cellDates:false});
  const out=[];
  wb.SheetNames.forEach(sn=>{ const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:false}); const t=makeTable(aoa,name,sn); if(t&&t.rows.length) out.push(t); });
  return out;
}

  const stockDed=new Map(), stockTx=new Map(), empTotal=new Map(), empPair=new Map();
  const getMat=k=>{ let m=mats.get(k); if(!m){ m={key:k,codigo:'',descricao:'',categoria:'',unidade:'',osSet:new Set(),consDiarioInf:null,consMensalInf:null}; mats.set(k,m); } return m; };
  const getOS=n=>{ let o=osMap.get(n); if(!o){ o={os:n,disp:n,dataAbertura:null,statusRaw:'',explicitStage:'',items:new Map()}; osMap.set(n,o); } return o; };

  for(const t of S.tables){
    const F={}; t.map.forEach((f,i)=>{ if(f&&F[f]==null) F[f]=i; });
    const has=f=>F[f]!=null;
    const tx=has('os')||has('data')||has('dataOS');
    const empF=has('empenhado')?'empenhado':(has('venda')?'venda':null);
    const movTable=has('data')&&(has('etapa')||has('tipo'));
    if(has('codigo')) flags.codigo=true; if(has('estoque')) flags.estoque=true; if(empF) flags.empenho=true; if(has('os')) flags.os=true;
    if(movTable) flags.mov=true; if(has('data')&&has('consumo')) flags.cons=true; if(has('consDiario')||has('consMensal')) flags.consInf=true; if(has('categoria')) flags.categoria=true; if(has('data')&&has('entrada')) flags.ent=true;
    const tSL=new Map(), tSS=new Map(), tEL=new Map(), tES=new Map();
    for(const r of t.rows){
      const raw=f=>has(f)?r[F[f]]:null;
      const str=f=>{ const v=raw(f); return v==null?'':String(v).trim(); };
      const num=f=>parseNum(raw(f));
      const codeRaw=str('codigo'), descr=str('descricao');
      const key=codeRaw?cleanKey(raw('codigo')):(descr?'D:'+descr.toUpperCase():'');
      const osn=has('os')?cleanKey(raw('os')):'';
      let m=null;
      if(key){
        m=getMat(key);
        if(codeRaw&&!m.codigo) m.codigo=cleanDisp(raw('codigo'));
        if(descr&&!m.descricao) m.descricao=descr;
        const c=str('categoria'); if(c&&!m.categoria) m.categoria=c;
        const u=str('unidade'); if(u&&!m.unidade) m.unidade=u;
        const cd=num('consDiario'); if(cd!=null) m.consDiarioInf=cd;
        const cm=num('consMensal'); if(cm!=null) m.consMensalInf=cm;
      }
      let dt=has('data')?parseDate(raw('data')):null;
      if(dt&&has('hora')){ const tm=parseTime(raw('hora')); if(tm){ const d=dt.date; dt={date:new Date(d.getFullYear(),d.getMonth(),d.getDate(),tm.h,tm.m),hasTime:true}; } }
      let isMov=false;
      if(dt&&movTable){
        const text=str('etapa')||str('tipo');
        if(text){
          isMov=true; const sg=stageOf(text);
          const q=num('quantidade')!=null?num('quantidade'):num('produzida');
          movs.push({date:dt.date,hasTime:dt.hasTime,key,os:osn,kind:sg.kind,label:sg.label,raw:text,qtd:q,obs:str('obs'),src:t.name});
          if(sg.kind==='consumo'&&!has('consumo')&&key&&q){ cons.push({date:dt.date,key,qtd:Math.abs(q)}); flags.cons=true; }
          if(sg.kind==='entrada'&&!has('entrada')&&key&&q){ ents.push({date:dt.date,key,qtd:Math.abs(q)}); flags.ent=true; }
        }
      }
      if(dt&&key){
        if(has('consumo')){ const c=num('consumo'); if(c) cons.push({date:dt.date,key,qtd:Math.abs(c)}); }
        if(has('entrada')){ const e=num('entrada'); if(e) ents.push({date:dt.date,key,qtd:Math.abs(e)}); }
      }
      if(osn){
        const o=getOS(osn); if(!o.dispSet){ o.disp=cleanDisp(raw('os')); o.dispSet=true; }
        let od=has('dataOS')?parseDate(raw('dataOS')):null;
        if(!od&&dt&&!movTable) od=dt;
        if(od&&(!o.dataAbertura||od.date<o.dataAbertura)) o.dataAbertura=od.date;
        const stt=str('status'); if(stt) o.statusRaw=stt;
        if(!isMov&&str('etapa')) o.explicitStage=str('etapa');
        if(key){
          m.osSet.add(osn);
          let it=o.items.get(key); if(!it){ it={necessaria:null,empenhado:null}; o.items.set(key,it); }
          const n=num('necessaria'); if(n!=null) it.necessaria=n;
          if(empF){ const e=num(empF); if(e!=null) it.empenhado=e; }
        }
      }
      if(key&&has('estoque')){ const e=num('estoque'); if(e!=null){ if(tx) tSL.set(key,e); else tSS.set(key,(tSS.get(key)||0)+e); } }
      if(key&&empF){ const e=num(empF); if(e!=null){ if(osn) empPair.set(key+'|'+osn,{key,v:e}); else if(tx) tEL.set(key,e); else tES.set(key,(tES.get(key)||0)+e); } }
    }
    tSS.forEach((v,k)=>stockDed.set(k,v)); tSL.forEach((v,k)=>stockTx.set(k,v));
    tES.forEach((v,k)=>empTotal.set(k,v)); tEL.forEach((v,k)=>empTotal.set(k,v));
  }

  movs.sort((a,b)=>a.date-b.date);
  const movByKey=new Map(), movByOS=new Map();
  for(const mv of movs){
    if(mv.key){ if(!movByKey.has(mv.key)) movByKey.set(mv.key,[]); movByKey.get(mv.key).push(mv); if(!mats.has(mv.key)) getMat(mv.key); }
    if(mv.os){ if(!movByOS.has(mv.os)) movByOS.set(mv.os,[]); movByOS.get(mv.os).push(mv); const o=getOS(mv.os); if(mv.key){ getMat(mv.key).osSet.add(mv.os); if(!o.items.has(mv.key)) o.items.set(mv.key,{necessaria:null,empenhado:null}); } }
  }
  const byKey=(arr)=>{ const mp=new Map(); for(const e of arr){ if(!mp.has(e.key)) mp.set(e.key,[]); mp.get(e.key).push(e); } return mp; };
  cons.sort((a,b)=>a.date-b.date); ents.sort((a,b)=>a.date-b.date);
  const consByKey=byKey(cons), entsByKey=byKey(ents);
  cons.forEach(e=>{ if(!mats.has(e.key)) getMat(e.key); });
  let gFirst=null,gLast=null; for(const e of cons){ if(!gFirst||e.date<gFirst) gFirst=e.date; if(!gLast||e.date>gLast) gLast=e.date; }
  const empByKey=new Map(); empPair.forEach(({key,v})=>{ empByKey.set(key,(empByKey.get(key)||0)+v); });

  // OS
  for(const o of osMap.values()){
    o.movs=movByOS.get(o.os)||[];
    o.lastMov=o.movs.length?o.movs[o.movs.length-1]:null;
    let lp=null; for(let i=o.movs.length-1;i>=0;i--){ if(prodStage(o.movs[i])){ lp=o.movs[i]; break; } }
    if(lp) o.etapa=prodStage(lp);
    else if(o.explicitStage){ const sg=stageOf(o.explicitStage); o.etapa=sg&&sg.kind==='stage'?sg.label:(sg&&sg.kind==='event'?'Aguardando produção':'Sem movimentação'); }
    else o.etapa='Sem movimentação';
    const s=norm(o.statusRaw); let key='aguardando', reason='';
    if(/cancel/.test(s)) key='cancelada';
    else if(o.etapa==='Produção concluída'||o.etapa==='Expedição'||/conclu|finaliz|encerr|entreg|fatur/.test(s)) key='concluida';
    else if(/parad|suspen|bloque|interromp|paralis/.test(s)){ key='parada'; reason='Status informado: '+o.statusRaw; }
    else if(ACTIVE.has(o.etapa)){ const ref=o.lastMov?o.lastMov.date:null; const dd=ref?diffDays(ref,today):null; if(dd!=null&&dd>st.osParada){ key='parada'; reason='Sem movimentação há '+dd+' dias'; } else key='emprod'; }
    else if(/produc|andament|execu|iniciad/.test(s)) key='emprod';
    o.status=Object.assign({key,reason},OSST[key]);
    o.inicio=o.dataAbertura||(o.movs[0]?o.movs[0].date:null);
    const fim=(key==='concluida'&&o.lastMov)?o.lastMov.date:today;
    o.tempoDias=o.inicio?Math.max(0,diffDays(o.inicio,fim)):null;
  }

  // materials
  const ctx={today,gFirst,gLast,hasCons:cons.length>0};
  const list=[];
  for(const m of mats.values()){
    const k=m.key;
    m.estoque=stockDed.has(k)?stockDed.get(k):(stockTx.has(k)?stockTx.get(k):null);
    if(empTotal.has(k)){ m.empenhado=empTotal.get(k); m.empSrc='total'; }
    else if(empByKey.has(k)){ m.empenhado=empByKey.get(k); m.empSrc='os'; }
    else { m.empenhado=flags.empenho?0:null; m.empSrc='none'; }
    m.disponivel=m.estoque==null?null:m.estoque-(m.empenhado||0);
    m.osList=Array.from(m.osSet).sort((a,b)=>numCmp(b,a));
    m.osObjs=m.osList.map(n=>osMap.get(n)).filter(Boolean);
    const set=new Set(movByKey.get(k)||[]);
    m.osList.forEach(n=>(movByOS.get(n)||[]).forEach(mv=>{ if(!mv.key) set.add(mv); }));
    m.movs=Array.from(set).sort((a,b)=>a.date-b.date);
    m.lastMov=m.movs.length?m.movs[m.movs.length-1]:null;
    let lp=null; for(let i=m.movs.length-1;i>=0;i--){ if(prodStage(m.movs[i])){ lp=m.movs[i]; break; } }
    if(lp) m.etapa=prodStage(lp);
    else { const oe=m.osObjs.find(o=>o.explicitStage&&o.status.key!=='concluida'); m.etapa=oe?oe.etapa:'Sem movimentação'; }
    const pri=m.osObjs.slice().sort((a,b)=>a.status.ord-b.status.ord)[0];
    m.osStatus=pri?pri.status:null;
    m.inProd=ACTIVE.has(m.etapa)||m.osObjs.some(o=>o.status.key==='emprod'||o.status.key==='parada');
    m.cons=consByKey.get(k)||[]; m.ents=entsByKey.get(k)||[];
    m.cob=coverage(m,ctx);
    if(m.disponivel!=null&&m.disponivel<=0) m.risk='perigo';
    else if(!m.cob.ok) m.risk='semdados';
    else m.risk=m.cob.dias<=st.limite?'perigo':'normal';
    let sk='normal';
    if(m.estoque==null) sk='nd';
    else if(m.disponivel<0) sk='insuf';
    else if(m.disponivel===0) sk='zero';
    else if(m.risk==='perigo') sk='perigo';
    else if(m.estoque>0&&(m.empenhado||0)/m.estoque*100>=st.empLimiar) sk='empenhado';
    m.status=Object.assign({key:sk},STATUS[sk]);
    m.empRatio=m.estoque>0?(m.empenhado||0)/m.estoque:null;
    m.soon=m.cob.ok&&m.risk==='normal'&&m.cob.dias<=st.limite+st.antecipado;
    list.push(m);
  }
  const cats=Array.from(new Set(list.map(m=>m.categoria).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  S.model={mats:list,osMap,osList:Array.from(osMap.values()),movs,cons,ents,flags,gFirst,gLast,today,cats};
  S.updatedAt=new Date();
}

/* consumption coverage — days the available stock covers at the current consumption pace */
function coverage(m,ctx){
  const st=S.settings, un=m.unidade||'un';
  const res={ok:false,reason:'',daily:null,weekly:null,monthly:null,dias:null,alcance:null,basis:'',method:'',noCons:false};
  let daily=null;
  if(ctx.hasCons){
    const ref=st.ref==='hoje'?dayStart(ctx.today):dayStart(ctx.gLast);
    const g0=dayStart(ctx.gFirst);
    const R=P=>{ let from=addDays(ref,-(P-1)); if(from<g0) from=g0; const days=diffDays(from,ref)+1; if(days<st.minDias) return null; const end=addDays(ref,1); let tot=0; for(const e of m.cons){ if(e.date>=from&&e.date<end) tot+=e.qtd; } return {P,from,to:ref,days,tot,rate:tot/days}; };
    let use=null,note='';
    if(st.periodo==='auto'){
      const b=R(30)||R(15)||R(7);
      if(b){ use=b; note='Automático: ritmo estável, base de '+b.days+' dias';
        if(b.P>15){ const rc=R(15); if(rc&&rc.days<b.days){
          if(b.rate===0&&rc.rate>0){ use=rc; note='Automático: consumo apenas nos últimos 15 dias'; }
          else if(b.rate>0){ const v=(rc.rate-b.rate)/b.rate; if(Math.abs(v)*100>st.variacao){ use=rc; note='Automático: ritmo dos últimos 15 dias '+(v>0?'+':'')+fpct(v)+' em relação aos 30 dias; usando o mais recente'; } }
        }}
      }
    } else { use=R(+st.periodo); note='Período fixo: últimos '+st.periodo+' dias'; }
    if(!use){ res.reason='Dados insuficientes para cálculo'; res.basis='Histórico de consumo com menos de '+st.minDias+' dias'; return res; }
    daily=use.rate; res.method=note;
    res.basis=fq(use.tot)+' '+un+' consumidos em '+use.days+' dias ('+fd(use.from)+' a '+fd(use.to)+')';
    if(!(daily>0)&&(m.consDiarioInf>0||m.consMensalInf>0)){ daily=m.consDiarioInf>0?m.consDiarioInf:m.consMensalInf/30; res.method='Sem consumo registrado no período; usando o consumo médio informado na planilha'; res.basis='Consumo médio informado: '+fq(daily)+' '+un+'/dia'; }
  } else if(m.consDiarioInf>0||m.consMensalInf>0){
    daily=m.consDiarioInf>0?m.consDiarioInf:m.consMensalInf/30;
    res.method='Consumo médio informado na planilha';
    res.basis=m.consDiarioInf>0?'Consumo médio diário informado: '+fq(daily)+' '+un:'Consumo médio mensal informado: '+fq(m.consMensalInf)+' '+un+' ÷ 30 dias';
  } else { res.reason='Dados insuficientes para cálculo'; res.basis='Sem histórico de consumo nas planilhas'; return res; }
  res.daily=daily;
  if(!(daily>0)){ res.reason='Sem consumo no período'; res.noCons=true; res.daily=0; res.weekly=0; res.monthly=0; return res; }
  res.weekly=daily*7; res.monthly=daily*30;
  if(m.disponivel==null){ res.reason='Estoque não informado'; return res; }
  res.dias=m.disponivel<=0?0:m.disponivel/daily;
  res.alcance=res.dias>st.limite?addDays(dayStart(ctx.today),Math.floor(res.dias-st.limite)):null;
  res.ok=true; return res;
}

/* ================= filtering ================= */
const ALERT_PRED={
  perigo:m=>m.risk==='perigo',
  soon:m=>m.soon,
  semestoque:m=>m.disponivel!=null&&m.disponivel<=0,
  semmov:m=>!m.lastMov,
  empgrande:m=>m.status.key==='empenhado'||(m.empRatio!=null&&m.empRatio*100>=S.settings.empLimiar),
  emproducao:m=>m.inProd,
  nd:m=>m.estoque==null
};
const ALERT_LABEL={perigo:'Perigo: cobertura ≤ limite',soon:'Entram em perigo em breve',semestoque:'Sem estoque disponível',semmov:'Sem movimentação registrada',empgrande:'Grande quantidade empenhada',emproducao:'Materiais em produção',nd:'Estoque não informado'};
function materialFiltersActive(){ const f=S.filters; return !!(f.q||f.cat||f.status||f.risco||f.etapa||f.mov||f.alert||(f.prod&&f.prod!=='')); }
function filteredMats(){
  const f=S.filters, M=S.model; if(!M) return [];
  const q=norm(f.q);
  return M.mats.filter(m=>{
    if(q){ const hay=norm(m.codigo+' '+m.descricao+' '+m.osList.join(' ')); if(!hay.includes(q)) return false; }
    if(f.cat&&(m.categoria||'__nd')!==f.cat) return false;
    if(f.status&&m.status.key!==f.status) return false;
    if(f.risco&&m.risk!==f.risco) return false;
    if(f.etapa&&m.etapa!==f.etapa) return false;
    if(f.prod){ if(f.prod==='semos'){ if(m.osObjs.length) return false; } else if(!m.osObjs.some(o=>o.status.key===f.prod)) return false; }
    if(f.mov==='com'&&!m.lastMov) return false;
    if(f.mov==='sem'&&m.lastMov) return false;
    if(f.alert&&ALERT_PRED[f.alert]&&!ALERT_PRED[f.alert](m)) return false;
    return true;
  });
}
function visibleOS(fm){
  const f=S.filters, M=S.model; if(!M) return [];
  const keys=new Set(fm.map(m=>m.key)); const onlyProd=!(f.q||f.cat||f.status||f.risco||f.etapa||f.mov||f.alert);
  const q=norm(f.q);
  return M.osList.filter(o=>{
    if(f.prod&&f.prod!=='semos'&&o.status.key!==f.prod) return false;
    if(f.prod==='semos') return false;
    if(onlyProd) return true;
    if(q&&norm(o.disp).includes(q)) return true;
    for(const k of o.items.keys()) if(keys.has(k)) return true;
    return false;
  });
}

function chart(id,cfg,emptyMsg){
  if(CH[id]){ CH[id].destroy(); delete CH[id]; }
  const em=$('#e-'+id.slice(2)), cv=$('#'+id); if(!cv||!em) return;
  if(!window.Chart){ em.hidden=false; em.textContent='Não foi possível carregar a biblioteca de gráficos.'; cv.hidden=true; return; }
  if(emptyMsg){ em.hidden=false; em.textContent=emptyMsg; cv.hidden=true; return; }
  em.hidden=true; cv.hidden=false; CH[id]=new Chart(cv,cfg);
}
const axisX=(o)=>Object.assign({grid:{display:false},ticks:{color:TK.muted,maxRotation:0,autoSkip:true}},o||{});
const axisY=(o)=>Object.assign({grid:{color:TK.grid},border:{display:false},ticks:{color:TK.muted,callback:v=>fq(v)}},o||{});
function periodRange(){
  const M=S.model; const end=dayStart(S.settings.ref==='hoje'||!M.gLast?M.today:M.gLast);
  let start;
  if(S.filters.periodo==='all'){ const cand=[M.gFirst,M.ents.length?M.ents[0].date:null].filter(Boolean); start=cand.length?dayStart(new Date(Math.min(...cand))):addDays(end,-89); }
  else start=addDays(end,-(+S.filters.periodo-1));
  if(start>end) start=end;
  return {start,end,days:diffDays(start,end)+1};
}
function series(events,keys,range){
  const {start,days}=range; const arr=new Array(days).fill(0); const endX=addDays(range.end,1);
  for(const e of events){ if(!keys.has(e.key)) continue; if(e.date<start||e.date>=endX) continue; arr[diffDays(start,e.date)]+=e.qtd; }
  return arr;
}
function bucketize(arr,range){
  const labels=[]; const weekly=range.days>45; if(!weekly){ for(let i=0;i<range.days;i++){ const d=addDays(range.start,i); labels.push(pad(d.getDate())+'/'+pad(d.getMonth()+1)); } return {labels,agg:a=>a,weekly}; }
  for(let i=0;i<range.days;i+=7){ const d=addDays(range.start,i); labels.push(pad(d.getDate())+'/'+pad(d.getMonth()+1)); }
  return {labels,agg:a=>{ const o=[]; for(let i=0;i<a.length;i+=7){ o.push(a.slice(i,i+7).reduce((s,x)=>s+x,0)); } return o; },weekly};
}

function sitOf(m){
  const zero=m.disponivel!=null&&m.disponivel<=0;
  if(zero) return {k:'perigo',cls:'dr',num:'0',unit:'dias',label:m.disponivel<0?'Estoque insuficiente':'Sem estoque disponível'};
  if(m.cob.ok){ const d=Math.floor(m.cob.dias);
    if(m.risk==='perigo') return {k:'perigo',cls:'dr',num:NF0.format(d),unit:d===1?'dia':'dias',label:'Perigo'};
    if(m.soon) return {k:'normal',cls:'dy',num:NF0.format(d),unit:'dias',label:'Atenção'};
    return {k:'normal',cls:'dg',num:NF0.format(d),unit:'dias',label:'Normal'}; }

}

  else if(kind==='completo'){
    const withStock=fm.filter(m=>m.estoque!=null); const s=(f)=>withStock.reduce((a,m)=>a+(f(m)||0),0);
    const resumo=[['Total de materiais',fm.length],['Estoque total',s(m=>m.estoque)],['Total empenhado',fm.reduce((a,m)=>a+(m.empenhado||0),0)],['Estoque disponível',s(m=>m.disponivel)],['Materiais em produção',fm.filter(m=>m.inProd).length],['OS em produção',vos.filter(o=>o.status.key==='emprod'||o.status.key==='parada').length],['Materiais em PERIGO (≤ '+S.settings.limite+' dias)',fm.filter(m=>m.risk==='perigo').length],['Materiais sem estoque',fm.filter(ALERT_PRED.semestoque).length],['Gerado em',fd(new Date())+' '+ft(new Date())]].map(([k,v])=>({'Indicador':k,'Valor':v}));
    name='relatorio-completo';
    sheets=[{name:'Resumo',rows:resumo},{name:'Materiais',rows:fm.map(matRow)},{name:'Em perigo',rows:sortCob(fm.filter(m=>m.risk==='perigo')).map(matRow)},{name:'OS',rows:osRowsFor(vos).map(osRow)},{name:'Movimentações',rows:tabRows('mov',fm,vos).slice().reverse().map(movRow)}];
    pdfT='Relatório de estoque e produção'; pdfS=[{title:'Resumo',rows:resumo.map(r=>({'Indicador':r['Indicador'].replace('≤','até'),'Valor':r['Valor']}))},{title:'Materiais em PERIGO',rows:pdfSlim(sortCob(fm.filter(m=>m.risk==='perigo')).map(matRow),PDF_MAT)},{title:'OS em produção',rows:pdfSlim(osRowsFor(vos.filter(o=>o.status.key==='emprod'||o.status.key==='parada')).map(osRow),['OS','Material','Qtd. necessária','Qtd. empenhada','Qtd. disponível','Etapa atual','Status da produção','Última movimentação','Tempo (dias)'])},{title:'Todos os materiais',rows:pdfSlim(fm.map(matRow),PDF_MAT)}];
  }
  try{
    if(fmt==='csv'){ if(sheets.length>1){ for(const sh of sheets) await saveFile(name+'-'+norm(sh.name).replace(/ /g,'-')+'-'+stamp+'.csv',toCSV(sh.rows),'text/csv;charset=utf-8'); } else await saveFile(name+'-'+stamp+'.csv',toCSV(sheets[0].rows),'text/csv;charset=utf-8'); }
    else if(fmt==='xlsx'){ if(!window.XLSX){ toast('A biblioteca do Excel não carregou. Use CSV.'); return; } await saveFile(name+'-'+stamp+'.xlsx',toXLSX(sheets)); }
    else { if(!window.jspdf||!window.jspdf.jsPDF){ toast('A biblioteca de PDF não carregou. Use Excel ou CSV.'); return; } await saveFile(name+'-'+stamp+'.pdf',toPDF(pdfT,pdfS)); }
  }catch(e){ toast('Erro ao gerar o arquivo: '+(e.message||e)); }
}

/* ================= sample data (clearly flagged) ================= */
function sampleTables(){
  let seed=20260927; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const today=dayStart(new Date());
  const dstr=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
  // code, description, category, unit, physical stock, base daily use, recent trend
  const MATS=[
    ['PC-TRI-250','Papel cartão triplex 250 g/m² 66×96','Papel cartão','fl',42000,640,1],
    ['PC-TRI-300','Papel cartão triplex 300 g/m² 77×113','Papel cartão','fl',16800,430,1.45],

    ['CO-FOS-115','Couché fosco 115 g/m² 66×96','Papel','fl',22500,520,.9],
    ['OF-090','Papel offset 90 g/m² 66×96','Papel','fl',98000,1150,1],
    ['KR-080','Papel kraft 80 g/m² em bobina','Papel','kg',2350,41,1],
    ['TI-CIA','Tinta offset ciano','Tintas','kg',210,4.2,1],
    ['TI-MAG','Tinta offset magenta','Tintas','kg',96,4.6,1.2],
    ['TI-AMA','Tinta offset amarelo','Tintas','kg',260,3.9,1],
    ['TI-PRE','Tinta offset preto','Tintas','kg',118,5.1,1],
    ['TI-PAN-185','Tinta Pantone 185 C','Tintas','kg',22,0,1],
    ['VZ-UV-BRI','Verniz UV brilho','Vernizes','kg',520,9.5,1],
    ['VZ-AQ-FOS','Verniz aquoso fosco','Vernizes','kg',150,6.8,1.1],
    ['CL-PVA','Cola PVA para colagem de cartucho','Adesivos','kg',410,7.5,1],
    ['CL-HOT','Cola hot melt granulada','Adesivos','kg',88,3.1,1],
    ['CH-CTP-745','Chapa CTP térmica 745×605','Chapas','un',780,22,1],
    ['CH-CTP-1030','Chapa CTP térmica 1030×790','Chapas','un',150,9,1],
    ['BL-BOR-1050','Blanqueta de borracha 1050×880','Acessórios de máquina','un',8,.12,1],
    ['FT-BOPP-35','Filme BOPP fosco 35 µm para laminação','Acabamento','m',19500,640,1],
    ['HS-OUR-64','Fita hot stamping ouro 64 mm','Acabamento','m',3100,0,1],
    ['CX-EMB-40','Caixa de embarque 40×30×30','Embalagem','un',860,31,.7],
    ['FA-ARQ-12','Fita para arquear 12 mm','Embalagem','rl',70,1.8,1]
  ];
  const OSDEF=[ // os, opened days ago, target stage index (in STAGES), days since last movement, status text, materials [code,necessary]
    [4812,24,8,1,'Concluída',[['PC-TRI-250',6200],['TI-CIA',18],['CL-PVA',22]]],
    [4813,20,7,2,'Concluída',[['CO-BRI-150',12000],['TI-PRE',21],['VZ-UV-BRI',35]]],
    [4814,15,6,0,'Em produção',[['PC-TRI-300',5400],['FT-BOPP-35',4800],['TI-MAG',26]]],
    [4815,12,5,1,'Em produção',[['PC-DUP-350',4200],['TI-AMA',14]]],
    [4816,10,4,0,'Em produção',[['PC-TRI-250',8000],['CL-PVA',30],['TI-PRE',19]]],
    [4817,9,3,6,'Em produção',[['CO-FOS-115',7000],['TI-MAG',22],['CH-CTP-745',8]]],
    [4818,5,3,0,'Em produção',[['OF-090',15000],['TI-PRE',25],['CH-CTP-1030',4]]],
    [4819,4,2,1,'Em produção',[['PC-SBS-280',1900],['VZ-AQ-FOS',12]]],
    [4820,8,2,5,'Em produção',[['PC-TRI-300',3600],['TI-CIA',10]]],
    [4821,3,1,1,'Aberta',[['CO-BRI-150',9000],['TI-AMA',12]]],
    [4822,2,0,0,'Aberta',[['KR-080',380],['CL-HOT',9]]],
    [4823,1,0,0,'Aberta',[['PC-TRI-250',5200],['TI-MAG',20],['CX-EMB-40',120]]],

    [4825,11,3,4,'Suspensa',[['CO-BRI-150',6500],['TI-CIA',16],['HS-OUR-64',900]]]
  ];
  const obsPool=['','','','Acerto de máquina concluído','Perda de 2% no acerto','Aguardando aprovação de prova','Troca de faca','Operador turno B'];

  const tMov=[['Data da Movimentação','Hora','Número da OS','Código do Material','Etapa','Quantidade','Observação']];
  const empOpen={};
  OSDEF.forEach(([os,open,tgt,last,status,items])=>{
    const openD=addDays(today,-open);
    const done=status==='Concluída';
    items.forEach(([c,n])=>{ const emp=done?0:n; if(emp) empOpen[c]=(empOpen[c]||0)+emp; tOS.push([os,c,n,emp,dstr(openD),status]); });
    if(tgt>=1){
      const seq=tgt===1?[1]:[2,3,4,5,6,7,8].filter(i=>i<=tgt);
      const lastD=addDays(today,-last), span=Math.max(0,diffDays(openD,lastD));
      seq.forEach((si,j)=>{ const d=addDays(openD,seq.length===1?Math.min(span,1):Math.round(span*(j+1)/seq.length)); const h=7+Math.floor(rnd()*10), mi=Math.floor(rnd()*60);

        tMov.push([dstr(d),pad(h)+':'+pad(mi),os,si===2?items[0][0]:'',STAGES[si],qty,obsPool[Math.floor(rnd()*obsPool.length)]]); });

  MATS.forEach(([c,d,cat,un,est])=>{ const e=(empOpen[c]||0)+(extra[c]||0); tEst.push([c,d,cat,un,est,e]); });

  MATS.forEach(([c,d,cat,un,est,rate,trend],mi)=>{
    if(rate>0) for(let i=89;i>=0;i--){ const day=addDays(today,-i); if(day.getDay()===0) continue; const f=i<15?trend:1; const q=rate*f*(0.55+rnd()*0.9)*7/6; if(rnd()<0.12) continue; const v=un==='kg'||un==='un'||un==='rl'?Math.round(q*10)/10:Math.round(q); if(v>0) tCon.push([dstr(day),c,v,null]); }
    if(rate>0) for(let i=85-(mi%5)*3;i>0;i-=21+(mi%4)*4){ const day=addDays(today,-i); tCon.push([dstr(day),c,null,Math.round(rate*(18+rnd()*10))]); }
  });
  return [makeTable(tEst,'Exemplo · Estoque','Estoque'),makeTable(tOS,'Exemplo · Ordens de serviço','OS'),makeTable(tMov,'Exemplo · Movimentações','Movimentações'),makeTable(tCon,'Exemplo · Consumo e entradas','Consumo')].map(t=>{ t.name=t.file; return t; });
}
function loadSample(){ S.tables=sampleTables(); S.sample=true; S.pending=[]; S.notifDismissed=false; closeModal(); recompute(true); lsDel(LS_DATA); }

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target;
  const osb=t.closest('[data-os]'); if(osb){ e.stopPropagation(); openOS(osb.dataset.os); return; }
  const matb=t.closest('[data-mat]'); if(matb){ openMaterial(matb.dataset.mat); return; }
  const act=t.closest('[data-act]'); if(act){ const a=act.dataset.act; if(a==='import') openImport(); else if(a==='sample') loadSample(); else if(a==='template') downloadTemplate(); $('#export-menu').hidden=true; return; }
  if(t.closest('[data-close]')){ closeModal(); return; }
  if(t.closest('[data-nclose]')){ const n=$('#notif'); if(n) n.remove(); S.notifDismissed=true; return; }
  const al=t.closest('[data-alert]'); if(al){ const k=al.dataset.alert; closeModal(); const n=$('#notif'); if(n) n.remove(); S.notifDismissed=true; S.filters.alert=k; S.tab='mat'; S.page=1; refresh(); document.getElementById('tabs').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const ak=t.closest('[data-alertk]'); if(ak){ const k=ak.dataset.alertk; const f=S.filters;
    if(k==='osaguard'){ f.prod=f.prod==='aguardando'?'':'aguardando'; f.alert=''; S.tab=f.prod?'os':S.tab; }
    else if(k==='osparada'){ f.prod=f.prod==='parada'?'':'parada'; f.alert=''; S.tab=f.prod?'os':S.tab; }
    else { f.alert=f.alert===k?'':k; if(f.alert) S.tab=S.tab==='os'||S.tab==='mov'?'mat':S.tab; }
    S.page=1; refresh(); return; }
  const kp=t.closest('[data-kpi]'); if(kp){ const k=kp.dataset.kpi; const f=S.filters;
    if(k==='osprod'){ f.prod=f.prod==='emprod'?'':'emprod'; S.tab=f.prod?'os':'mat'; }
    else if(ALERT_PRED[k]) { f.alert=f.alert===k?'':k; }
    else if(k==='all'){ Object.assign(f,{q:'',cat:'',status:'',risco:'',etapa:'',prod:'',mov:'',alert:''}); }
    else if(k==='emp'){ f.alert=f.alert==='empgrande'?'':'empgrande'; }
    else if(k==='est'){ S.tab='mat'; S.sort.mat={k:'estoque',d:-1}; }
    else if(k==='disp'){ S.tab='mat'; S.sort.mat={k:'disponivel',d:1}; }
    S.page=1; refresh(); return; }
  const sg=t.closest('[data-seg]'); if(sg){ const k=sg.dataset.seg; S.filters.risco=(S.filters.risco===k&&k)?'':k; S.filters.alert=''; S.page=1; refresh(); return; }
  const rk=t.closest('[data-risco]'); if(rk){ const k=rk.dataset.risco; S.filters.risco=S.filters.risco===k?'':k; S.page=1; refresh(); return; }
  const stg=t.closest('[data-etapa]'); if(stg){ const s=stg.dataset.etapa; S.filters.etapa=S.filters.etapa===s?'':s; S.page=1; refresh(); return; }
  const cl=t.closest('[data-clear]'); if(cl){ S.filters[cl.dataset.clear]=''; S.page=1; refresh(); return; }
  const tb=t.closest('[data-tab]'); if(tb){ S.tab=tb.dataset.tab; S.page=1; refresh(); return; }
  const th=t.closest('th[data-sort]'); if(th){ const s=S.sort[S.tab]; const k=th.dataset.sort; if(s.k===k) s.d=-s.d; else { s.k=k; s.d=1; } refresh(); return; }
  const pg=t.closest('[data-pg]'); if(pg&&!pg.disabled){ S.page+=pg.dataset.pg==='next'?1:-1; refresh(); return; }
  const te=t.closest('[data-texp]'); if(te){ doExport('tab',te.dataset.texp); return; }
  const ex=t.closest('[data-exp]'); if(ex){ const [k,f]=ex.dataset.exp.split('|'); $('#export-menu').hidden=true; doExport(k,f); return; }
  const rm=t.closest('[data-rmt]'); if(rm){ const id=rm.dataset.rmt; const np=S.pending.length; S.pending=S.pending.filter(x=>x.id!==id); if(S.pending.length===np){ S.tables=S.tables.filter(x=>x.id!==id); importDirty=true; } renderImport(); return; }
  const rowO=t.closest('[data-row-os]'); if(rowO){ openOS(rowO.dataset.rowOs); return; }
  const rowM=t.closest('[data-row-mat]'); if(rowM){ openMaterial(rowM.dataset.rowMat); return; }
  if(t.closest('#btn-export')){ const m=$('#export-menu'); renderExportMenu(); m.hidden=!m.hidden; $('#btn-export').setAttribute('aria-expanded',String(!m.hidden)); return; }
  if(!t.closest('#export-menu')) $('#export-menu').hidden=true;
  if(t.closest('#btn-import')){ openImport(); return; }
  if(t.closest('#btn-refresh')){ if(!S.tables.length){ openImport(); return; } recompute(false); toast('Dados recalculados em '+fd(S.updatedAt)+' às '+ft(S.updatedAt)+'. Para dados novos, importe a planilha atualizada.'); return; }
  if(t.closest('#btn-settings')){ openSettings(); return; }
  if(t.closest('#btn-bell')){ const pg=$('#perigo'); if(pg&&!$('#dash').hidden) pg.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(t.closest('#btn-method')){ openMethod(); return; }
  if(t.closest('#f-clear')){ Object.assign(S.filters,{q:'',cat:'',status:'',risco:'',etapa:'',prod:'',mov:'',alert:''}); S.page=1; refresh(); return; }
  if(t.closest('#f-toggle')){ const fm=$('#f-more'); fm.hidden=!fm.hidden; renderFilterControls(); return; }
  if(t.closest('#imp-go')){ commitImport(); return; }
  if(t.closest('#imp-clear')){ const b=t.closest('#imp-clear'); if(b.dataset.confirm){ S.tables=[]; S.pending=[]; S.sample=false; lsDel(LS_DATA); S.model=null; closeModal(); buildModel(); refresh(); toast('Dados removidos.'); } else { b.dataset.confirm='1'; b.textContent='Confirmar: apagar todos os dados'; } return; }
  if(t.closest('#s-save')){ saveSettings(); return; }
  if(t.closest('#s-reset')){ S.settings=Object.assign({},DEFAULT_SETTINGS); lsDel(LS_SET); closeModal(); recompute(true); toast('Padrões restaurados.'); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  const map={'f-cat':'cat','f-status':'status','f-risco':'risco','f-etapa':'etapa','f-prod':'prod','f-mov':'mov','f-periodo':'periodo'};
  if(map[t.id]){ S.filters[map[t.id]]=t.value; S.page=1; refresh(); return; }
  if(t.id==='f-sort'){ const [k,d]=t.value.split('|'); S.sort.mat={k,d:+d}; S.page=1; refresh(); return; }
  if(t.id==='pg-size'){ S.pageSize=t.value==='all'?'all':+t.value; S.page=1; refresh(); return; }
  if(t.id==='t-periodo'){ S.settings.periodo=t.value; lsSet(LS_SET,JSON.stringify(S.settings)); recompute(false); return; }
  if(t.id==='file-in'){ const fl=t.files; if(fl&&fl.length){ if(!$('#imp')) openImport(fl); else addFiles(fl); } t.value=''; return; }
  if(t.name==='imode'){ S.importMode=t.value; renderImport(); return; }
  if(t.dataset&&t.dataset.map){ const [id,i]=t.dataset.map.split('|'); const tb=S.pending.find(x=>x.id===id)||S.tables.find(x=>x.id===id); if(tb){ tb.map[+i]=t.value||null; if(!S.pending.includes(tb)) importDirty=true; renderImport(); } }
});
let qT=null;
$('#f-q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.filters.q=e.target.value.trim(); S.page=1; refresh(); const q=$('#f-q'); q.focus(); },220); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#ov')) closeModal(); else $('#export-menu').hidden=true; } });
// drag & drop anywhere
let dragN=0;
document.addEventListener('dragenter',e=>{ if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files')){ dragN++; const d=$('#drop'); if(d) d.classList.add('over'); } });
document.addEventListener('dragleave',()=>{ dragN=Math.max(0,dragN-1); if(!dragN){ const d=$('#drop'); if(d) d.classList.remove('over'); } });
document.addEventListener('dragover',e=>{ if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
document.addEventListener('drop',e=>{ if(!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); dragN=0; const fl=e.dataTransfer.files; if($('#imp')){ $('#drop')&&$('#drop').classList.remove('over'); addFiles(fl); } else openImport(fl); });

/* ================= boot ================= */
try{ const s=JSON.parse(lsGet(LS_SET)||'null'); if(s) Object.assign(S.settings,s); }catch(e){}
let restored=false;
try{ const d=JSON.parse(lsGet(LS_DATA)||'null'); if(d&&Array.isArray(d.tables)&&d.tables.length){ S.tables=d.tables; restored=true; } }catch(e){}
if(!restored){ S.tables=sampleTables(); S.sample=true; }
buildModel(); refresh({notify:true});
})();
